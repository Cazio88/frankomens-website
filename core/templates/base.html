{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FrankoMens Company Limited{% endblock %}</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'core/css/main.css' %}">

    <!-- Google Fonts (Elegant + Clean) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo">
                <a href="{% url 'home' %}">
                    <img src="{% static 'core/images/logo.png' %}" alt="FrankoMens Logo">
                </a>
            </div>

            <nav class="main-nav">
                <ul>
                    <li><a href="{% url 'home' %}">Home</a></li>
                    <li><a href="{% url 'about' %}">About</a></li>
                    <li><a href="{% url 'products' %}">Products</a></li>
                    <li><a href="{% url 'contact' %}">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Page Content -->
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ current_year }} FrankoMens Company Limited. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
